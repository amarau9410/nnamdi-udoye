name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage portfolio files
        run: |
          mkdir -p _portfolio
          cp index.html favicon.svg linkedin-profile.jpg .nojekyll _portfolio/
          cp Nnamdi_Udoye_Salesforce_CV_2026-10-12.docx Nnamdi_Udoye_Salesforce_CV_2026-10-12.pdf _portfolio/
          cp -R projects _portfolio/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _portfolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
